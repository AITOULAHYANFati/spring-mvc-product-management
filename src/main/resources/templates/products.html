<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymleaf.org"
            xmlns:layout="http://www.ultraq.net.nz/tyymeleaf/layout"
            layout:decorate="layout1.html">
            <head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/5.2.2/css/bootstrap.min.css">
</head>
<body>
<div class="p-3" layout:fragment="content1">
    <table class="table">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
        </thead>
        <tbody>
            <tr th:each="p:${productList}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
                <td>
                    <a class="btn btn-danger" onclick="return confirm('Etes vous sure ?')"  th:href="@{/delete(id=${p.id})}">Delete</a>
                </td>
            </tr>
        </tbody>


    </table>
</div>
</body>
</html>
